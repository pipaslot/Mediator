name: publish to nuget
# Keep this file name and do not add an `environment:` - the NuGet Trusted Publishing
# policy on nuget.org is bound to this repository and to `publish.yml`.
on:
  # Publishing a GitHub Release (Releases -> Draft a new release -> Publish) releases
  # the version of its tag `vX.Y.Z` to NuGet, see CONTRIBUTING.md#releasing.
  release:
    types: [published]
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC token for NuGet Trusted Publishing
    steps:
      - name: Resolve version
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not in the form vX.Y.Z (or vX.Y.Z-suffix for a pre-release)."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0 # MinVer needs full tag history to compute the version

      - name: Verify tag is on main or a release branch
        run: |
          git fetch origin main '+refs/heads/release/*:refs/remotes/origin/release/*' --quiet
          git branch -r --contains HEAD | grep -qE '(^|/)(main|release/)' \
            || { echo "::error::Tag ${{ github.event.release.tag_name }} (commit $(git rev-parse HEAD)) is not reachable from main or any release/* branch. Create the release from a commit that has been merged first."; exit 1; }

      # The rule rows only matter for the analyzer's own release tracking (RS2xxx) and are not part
      # of the package, so a forgotten move doesn't block the release - it is fixed in a follow-up PR.
      - name: Check analyzer rules were shipped
        run: |
          if grep -qE '^[A-Za-z]+[0-9]+ *\|' Pipaslot.Mediator.Analyzers/AnalyzerReleases.Unshipped.md; then
            echo "::warning::AnalyzerReleases.Unshipped.md still has rule entries. Run 'pwsh ./scripts/ship-analyzer-rules.ps1 -Version ${{ steps.resolve.outputs.version }}' and merge the result to main."
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests for Core
        run: |
          cd ./tests/Pipaslot.Mediator.Tests/
          dotnet test

      - name: Run tests for HTTP
        run: |
          cd ./tests/Pipaslot.Mediator.Http.Tests/
          dotnet test

      - name: Run tests for Analyzers
        run: |
          cd ./tests/Pipaslot.Mediator.Analyzers.Tests/
          dotnet test

      # Publish

      - name: Pack Core
        run: dotnet pack Pipaslot.Mediator/Pipaslot.Mediator.csproj -c Release -o ./packed/

      - name: Pack Http
        run: dotnet pack Pipaslot.Mediator.Http/Pipaslot.Mediator.Http.csproj -c Release -o ./packed/

      - name: Verify package version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          for package in Pipaslot.Mediator Pipaslot.Mediator.Http; do
            test -f "packed/${package}.${VERSION}.nupkg" \
              || { echo "::error::Expected packed/${package}.${VERSION}.nupkg, MinVer produced: $(ls packed)"; exit 1; }
          done

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: pipaslot

      - name: Publish
        run: dotnet nuget push ./packed/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
