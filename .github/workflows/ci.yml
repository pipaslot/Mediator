name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs full tag history to compute the version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Pipaslot.Mediator.slnx

      - name: Test Core with coverage
        run: >
          dotnet test tests/Pipaslot.Mediator.Tests
          --collect:"XPlat Code Coverage"
          --settings tests/Pipaslot.Mediator.Tests/coverage.runsettings
          --results-directory ./coverage/mediator

      - name: Test HTTP with coverage
        run: >
          dotnet test tests/Pipaslot.Mediator.Http.Tests
          --collect:"XPlat Code Coverage"
          --settings tests/Pipaslot.Mediator.Http.Tests/coverage.runsettings
          --results-directory ./coverage/http

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:./coverage/report -reporttypes:MarkdownSummaryGithub

      - name: Publish coverage to summary
        if: always()
        run: cat ./coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce coverage threshold
        run: |
          check_threshold() {
            local file=$1
            local name=$2
            local rate
            rate=$(grep -m1 -oP 'line-rate="\K[^"]+' "$file")
            local pct
            pct=$(awk "BEGIN { printf \"%.2f\", $rate * 100 }")
            echo "$name line coverage: $pct%"
            if awk "BEGIN { exit !($rate < 0.75) }"; then
              echo "::error::$name line coverage $pct% is below the 80% threshold"
              return 1
            fi
          }
          status=0
          check_threshold ./coverage/mediator/*/coverage.cobertura.xml "Pipaslot.Mediator" || status=1
          check_threshold ./coverage/http/*/coverage.cobertura.xml "Pipaslot.Mediator.Http" || status=1
          exit $status
