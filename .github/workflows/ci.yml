name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs full tag history to compute the version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Pipaslot.Mediator.slnx

      - name: Run tests for Core
        run: dotnet test tests/Pipaslot.Mediator.Tests

      - name: Run tests for HTTP
        run: dotnet test tests/Pipaslot.Mediator.Http.Tests
