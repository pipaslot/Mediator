name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs full tag history to compute the version

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check llms.txt covers docs/wiki
        run: |
          status=0
          for path in docs/wiki/*.md; do
            name=$(basename "$path")
            # _Sidebar.md is GitHub Wiki navigation chrome, not a content page
            if [ "$name" = "_Sidebar.md" ]; then continue; fi
            if ! grep -qF "docs/wiki/$name)" llms.txt; then
              echo "::error file=llms.txt::missing a link for docs/wiki/$name"
              status=1
            fi
          done
          for name in $(grep -o 'docs/wiki/[^)]*\.md' llms.txt | sed 's|docs/wiki/||' | sort -u); do
            if [ ! -f "docs/wiki/$name" ]; then
              echo "::error file=llms.txt::links docs/wiki/$name, which does not exist"
              status=1
            fi
          done
          exit $status

      - name: Build
        run: dotnet build Pipaslot.Mediator.slnx

      - name: Test Core with coverage
        run: >
          dotnet test tests/Pipaslot.Mediator.Tests
          --collect:"XPlat Code Coverage"
          --settings tests/Pipaslot.Mediator.Tests/coverage.runsettings
          --results-directory ./coverage/mediator

      - name: Test HTTP with coverage
        run: >
          dotnet test tests/Pipaslot.Mediator.Http.Tests
          --collect:"XPlat Code Coverage"
          --settings tests/Pipaslot.Mediator.Http.Tests/coverage.runsettings
          --results-directory ./coverage/http

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:./coverage/report -reporttypes:"MarkdownSummaryGithub;Cobertura"

      - name: Publish coverage to summary
        if: always()
        run: cat ./coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce coverage threshold
        run: |
          file=./coverage/report/Cobertura.xml
          rate=$(grep -m1 -oP 'line-rate="\K[^"]+' "$file")
          pct=$(awk "BEGIN { printf \"%.2f\", $rate * 100 }")
          echo "Overall line coverage: $pct%"
          if awk "BEGIN { exit !($rate < 0.85) }"; then
            echo "::error::Overall line coverage $pct% is below the 85% threshold"
            exit 1
          fi
